sonar.organization=tormax-ku
sonar.projectKey=TORmax-KU_csp-backend

sonar.sources=.
sonar.exclusions=node_modules/**,tmp/**,postman/**,**/*.test.js
sonar.tests=test
sonar.test.inclusions=test/**/*.test.js

# One-off developer/ops CLI tools (UC6) run manually against real infra; they have no
# automated test harness and aren't part of the running application's request path.
# security/ holds manual scan tools (OWASP ZAP) run against local Docker, not app code.
sonar.coverage.exclusions=scripts/**,security/**

sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage.lcov
