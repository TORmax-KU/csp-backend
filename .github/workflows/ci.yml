name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allows a manual run from the Actions tab

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway MongoDB so the database-backed tests (Bookmarks,
    # ProcurementQuery.integration) run instead of being skipped.
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_MONGO_URI: mongodb://localhost:27017/csp_ci_test

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # SonarQube needs full git history for blame/new-code analysis

      - uses: actions/setup-node@v5
        with:
          node-version: 22 # matches the Dockerfile (node:22-alpine)
          cache: npm

      - run: npm ci

      - run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
